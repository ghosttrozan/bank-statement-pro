services:
  - type: web
    name: statementpro-backend
    env: node
    rootDir: backend
    buildCommand: npm ci && npx puppeteer browsers install chrome && npm run build
    startCommand: npm run start
    envVars:
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/backend/.cache/puppeteer


      
